name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with test extras)
        run: pip install -e '.[test]'
      - name: Run unit suite (mocked, no network, no real builds)
        run: pytest -q
